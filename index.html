<style>

.fc,.sc2{text-align:left;border-radius:16px;padding:12px;background:var(--foam);color:var(--ink);border:2px solid var(--tq);font-weight:600}
.fc:hover,.sc2:hover{background:#d4f4f2}.fc .d,.sc2 .d{display:none;font-weight:400;margin-top:6px}.fc.open .d,.sc2.open .d{display:block}
.fc.open,.sc2.open{background:#fff;border-color:var(--deep)}
.ic{font-size:1.8em;display:block}
.chart text{font:600 11px sans-serif;fill:var(--ink)}
ul.t{padding-left:20px}.ref li{font-size:14px;margin-bottom:6px;word-break:break-word}
.cta{background:linear-gradient(135deg,var(--sea),var(--deep));color:#fff;text-align:center;border-radius:22px;padding:22px;font-size:1.4em;font-family:"Baloo 2",sans-serif}
.q button.o{display:block;width:100%;text-align:left;margin:6px 0;background:var(--foam);color:var(--ink);border:2px solid var(--tq);border-radius:14px}
.q .ok{background:#c9f2d6!important;border-color:#2e9e5b!important}.q .no{background:#ffd9d9!important;border-color:#d64545!important}
.ex{margin-top:8px;padding:8px 12px;background:#fff7d6;border-radius:12px}
main{padding-bottom:130px}
.abar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--deep);display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px))}
.abar button,.narr button{min-height:44px;font-size:15px;padding:8px 14px}.abar input[type=range]{flex:1 1 110px;max-width:220px;min-height:44px;accent-color:var(--tq)}
#mu{font-size:20px;min-width:48px}#an{color:#fff;font-size:13px;flex-basis:100%;text-align:center}#an:empty{display:none}
.narr{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:#fff;border-radius:22px;padding:10px 12px;margin:14px 0 0;box-shadow:0 2px 0 #b9e4e8}
.narr .n2{background:#fff;color:var(--deep);border:2px solid var(--sea)}.narr .n2:hover{background:var(--foam)}.ns{font-size:14px;color:var(--sea);font-weight:700}
@media(max-width:560px){body{font-size:16px}button{padding:9px 14px}}
@media print{.abar,.narr{display:none!important}}
@media print{header,.nav,.noprint{display:none}.page{display:block!important;break-after:page}.fc .d,.sc2 .d{display:block}body{background:#fff}}
@media(prefers-reduced-motion:reduce){.page{animation:none}}

<script>
const U=(i,x,y,w,h)=>`<use href="#${i}" x="${x}" y="${y}" width="${w}" height="${h}"/>`;

`<rect width="400" height="240" fill="url(#sea)"/><path d="M60 0 130 240H80zM250 0l60 240h-40z" fill="#ffffff18"/>${bub}<path d="M0 205q60-20 120 0t140 0 140-6V240H0z" fill="#f6e3b4"/><g stroke="#2e9e5b" stroke-width="5" fill="none" stroke-linecap="round"><path d="M20 215q-10-30 0-55M32 215q10-26 0-46M372 215q-10-30 0-55"/></g><g fill="#ff7aa2"><circle cx="300" cy="206" r="9"/><circle cx="312" cy="198" r="7"/><circle cx="288" cy="198" r="6"/></g><path d="M340 215v-24m0 10-9-9m9 3 9-9" stroke="#ff9a76" stroke-width="5" stroke-linecap="round"/>`;
const sc=(c,t)=>`<svg class="sc" viewBox="0 0 400 240" role="img" aria-label="${t}">${c}</svg>`;
const ill={
0:sc(bg()+U('g',90,60,220,176)+U('f',20,110,60,40)+U('f',330,70,50,34)+U('f',40,40,36,24),'Greeny the sea turtle swimming with fish'),
1:sc(bg()+U('g',110,70,170,136)+U('f',30,90,70,46)+U('f',310,120,56,38)+U('b',330,20,24,48)+U('l',60,20,40,44),'Greeny sees plastic floating near his reef home'),
2:sc(bg()+U('g',40,90,130,104)+U('f',200,110,70,46)+U('l',230,100,60,66)+U('r',250,30,130,104)+U('b',360,150,22,44),'Finn is tangled near a plastic bag while Rira explains'),
3:sc(bg()+U('p',30,60,90,165)+U('g',230,90,120,96)+'<rect x="130" y="40" width="130" height="38" rx="10" fill="#fff"/><text x="195" y="64" text-anchor="middle" font-size="14" font-weight="700" fill="#12344a">Land → Drains → Rivers → Sea</text>','Professor Pearl explains how plastic travels'),
4:sc(bg(1)+U('a',120,70,80,146)+U('g',220,130,110,88)+U('f',335,150,50,34)+'<rect x="40" y="170" width="30" height="42" rx="5" fill="#2e9e5b"/><text x="55" y="196" text-anchor="middle" font-size="16" fill="#fff">♻</text>','Abygirl cleans the beach with Greeny'),
5:sc(bg()+U('g',130,70,140,112)+U('r',30,110,110,88)+U('f',290,80,60,40)+'<text x="200" y="40" text-anchor="middle" font-size="18" font-weight="800" fill="#fff">Protect Our Ocean</text>','Greeny, Rira and Finn make a promise')
};
const yrs=[["2021","Darvel Bay, Sabah","A study of six coral reefs in Darvel Bay, Sabah, found an average of 10.7 marine litter items per 100 metres. Plastic represented 91% of the litter."],
["2022","24,301 kg","Volunteers collected 24,301 kg of rubbish along 394 km of Malaysia’s coastline. There were 44,706 plastic bottles collected."],
["2023","29,466 kg","Volunteers collected 29,466 kg of rubbish, including 47,382 plastic bottles and 31,210 plastic/foam pieces."],
["2024","41,015 kg","8,569 volunteers collected 41,015 kg of rubbish (Malaysia’s International Coastal Cleanup). This included 50,785 plastic bottles and 38,801 plastic/foam pieces."],
["2025","28,573 kg","Volunteers collected 28,573 kg of rubbish. This included 74,639 plastic bottles and 49,441 plastic/foam pieces."]];
function chart(title,unit,series,labels,max){const W=340,H=170,n=labels.length,k=series.length,gw=W/n;let s=`<svg class="chart" viewBox="0 0 ${W} ${H+30}" role="img" aria-label="${title}"><line x1="0" y1="${H}" x2="${W}" y2="${H}" stroke="#7fb8c4"/>`;
labels.forEach((l,i)=>{series.forEach((se,j)=>{const v=se.v[i],bw=Math.min(36,(gw-14)/k),x=i*gw+(gw-bw*k)/2+j*bw;if(v==null){s+=`<text x="${x+bw/2}" y="${H-6}" text-anchor="middle" style="font-size:9px">n/a</text>`}else{const h=v/max*(H-24);s+=`<rect x="${x}" y="${H-h}" width="${bw-2}" height="${h}" rx="4" fill="${se.c}"/><text x="${x+bw/2}" y="${H-h-4}" text-anchor="middle" style="font-size:8.5px">${v.toLocaleString('en-US')}</text>`}});s+=`<text x="${i*gw+gw/2}" y="${H+16}" text-anchor="middle">${l}</text>`});
return `<div><h3>${title}</h3><p style="margin:0;font-size:14px">Unit: ${unit}. ${series.map(a=>`<span style="color:${a.c}">■</span> ${a.n}`).join(' ')}</p>${s}</svg></div>`}
const cards=(arr,cls)=>`<div class="grid">${arr.map(a=>`<button class="${cls}" aria-expanded="false" onclick="this.classList.toggle('open');this.setAttribute('aria-expanded',this.classList.contains('open'))">${a[0]}<div class="d">${a[1]}</div></button>`).join('')}</div>`;
const sol=[["🧍 Individuals","Reduce plastic use and recycle."],["🎓 Students","Organise environmental campaigns and beach clean-ups."],["🎣 Fishermen","Dispose of fishing nets and equipment properly."],["🏪 Businesses","Reduce plastic packaging and provide environmentally friendly alternatives."],["🏛️ Government","Strengthen environmental laws and improve waste collection facilities."],["🏘️ Communities","Organise regular river and beach-cleaning programmes."]];
const refs=["Fauziah, S. H., et al. (2021). Marine debris in Malaysia: A review on the pollution intensity and mitigating measures. Marine Pollution Bulletin, 167, 112258. https://doi.org/10.1016/j.marpolbul.2021.112258","Santodomingo, N., et al. (2021). Marine litter pollution on coral reefs of Darvel Bay (East Sabah, Malaysia). Marine Pollution Bulletin, 173, 112998. https://doi.org/10.1016/j.marpolbul.2021.112998","Reef Check Malaysia. (2024). International Coastal Cleanup drives the removal of 41,015kg of waste from Malaysia’s beaches. https://www.reefcheck.org.my/press/international-coastal-cleanup-drives-the-removal-of-41015kg-of-waste-from-malaysias-beaches","Fauziah, S. H., et al. (2021). Marine debris in Malaysia: A review on the pollution intensity and mitigating measures. Marine Pollution Bulletin, 167, 112258. https://doi.org/10.1016/j.marpolbul.2021.112258","Lim, K. P., et al. (2024). Abundance of microplastics and its ecological risk assessment in coral reef regions of Peninsular Malaysia. Marine Pollution Bulletin. https://doi.org/10.1016/j.marpolbul.2024.117112","Gao, P., et al. (2025). Marine microplastic pollution in Peninsular Malaysia: A meta-analysis. Regional Studies in Marine Science. https://doi.org/10.1016/j.rsma.2025.104228","Sheriff, I., & Adams, M. (2025). Current status and future outlook of aquatic microplastic pollution in Malaysia. Regional Studies in Marine Science. https://doi.org/10.1016/j.rsma.2025.104504"];
const quiz=[["What did Rira call the tiny pieces of plastic that spread through the marine environment?",["Microplastics","Seagrass","Foam nets"],0,"Rira explained that tiny pieces of plastic, called microplastics, can spread through the marine environment."],
["In the 2021 Darvel Bay reef study, what share of the litter was plastic?",["34%","91%","10.7%"],1,"Plastic represented 91% of the litter. (10.7 was the average number of litter items per 100 m.)"],
["In which year did volunteers collect the most rubbish by weight (2022–2025)?",["2023","2025","2024"],2,"2024: 41,015 kg, the highest of the four years."],
["Which group should dispose of fishing nets and equipment properly?",["Fishermen","Students","Government"],0,"Abandoned fishing nets can threaten marine animals and damage coral reefs."],
["At Teluk Likas Beach (2025 study), what share of identified plastic debris was PET?",["91%","41%","34%"],2,"PET accounted for 34% of the plastic debris identified."]];
const head=(t,i,d)=>`<div class="card">${ill[i]}<div class="cap"><b>${i==0?'':''}${d[0]}</b>${d[1]}</div><h2>${t}</h2>`;
const pages=[
`<div class="card cover">${ill[0]}<h1>A Turtle’s Journey to a Plastic-Free Ocean</h1><div class="sub">An Illustrated Digital Storybook About Marine Plastic Pollution</div><h3>Meet Greeny, the Ocean Explorer</h3><span class="badge">SDG 14 – Life Below Water</span><p><button onclick="go(1)" style="font-size:1.2em">Start Reading</button></p></div>`,
head("Greeny’s Beautiful Home",1,["A Home Beneath the Waves","Greeny loves the colourful fish, seagrass, and coral that make his ocean home."])+`<div class="story"><p>Deep beneath the sparkling blue ocean lived a young sea turtle named Greeny. He loved swimming among colorful fish, exploring the coral reefs, and playing with his ocean friends. Every morning, sunlight danced across the water, making the sea look like a beautiful underwater garden.</p><p>Greeny believed the ocean was a wonderful home where every sea creature could live safely. One day, while swimming near the shore, Greeny noticed something unusual floating in the water. It was a plastic bottle. Nearby, he saw plastic bags and food wrappers drifting with the waves.</p><p>Greeny had never seen so much rubbish in his favourite swimming area. He wondered, “Where did all this rubbish come from, and what will happen to my ocean home?”</p><p>His journey to understand marine plastic pollution was about to begin.</p></div></div>`,
head("The Ocean’s Hidden Danger",2,["Something Is Wrong","Greeny and his friends discover that rubbish can put marine animals at risk."])+`<div class="story"><p>As Greeny swam closer to the floating rubbish, he noticed his little fish friend, Finn, struggling to swim near a discarded plastic bag.</p><p>“Oh no! Be careful, Finn!” Greeny called.</p><p>Greeny asked the other sea creatures for help, and together they guided Finn away from the rubbish. Finn was safe, but Greeny realised that plastic waste could cause serious problems for marine animals.</p><p>Rira, a wise old sea turtle, explained, “Plastic rubbish can harm sea creatures when they accidentally swallow it or become trapped in it. Tiny pieces of plastic, called microplastics, can also spread through the marine environment.”</p><p>Greeny looked around sadly. The ocean was home to countless living things, yet rubbish left behind by humans was putting their home at risk.</p><p>“We cannot let this continue,” Greeny said. “We need to learn how people can protect our ocean!”</p></div></div>`,
head("The Truth About Marine Plastic Pollution",3,["Professor Pearl Explains","The story connects Greeny’s experience to real-world evidence from Malaysia."])+`<div class="story"><p>“Every piece of plastic left in the environment can become a problem,” Professor Pearl explained. “Plastic waste can travel from land through drains and rivers into aquatic ecosystems.”</p></div></div>
<div class="card"><h2>Malaysia Marine Plastic Pollution Facts</h2><p>Tap a card to read the finding.</p>${cards(yrs.map(y=>[`<span class="ic">${y[0]}</span>${y[1]}`,y[2]]),'fc')}</div>
